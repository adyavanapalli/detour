[project]
name = "detour"
version = "0.1.0"
description = "Domain-based split tunneling with sing-box over WireGuard, for Android and Linux."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
detour = "detour.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/detour"]
