[project]
name = "detour"
version = "0.1.0"
description = "Domain-based split tunneling with sing-box over WireGuard, for Android and Linux."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# the Android target drives SFA's screen through uiautomator2 (Google's UiAutomator, wrapped for Python)
android = ["uiautomator2>=3.7"]

[project.scripts]
detour = "detour.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/detour"]
